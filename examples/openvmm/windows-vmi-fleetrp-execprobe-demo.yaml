apiVersion: v1
kind: Secret
metadata:
  name: cloudbuild-unattend-datavolume-sysprep
type: Opaque
stringData:
  # Requires outbound HTTPS during specialize. MSI diagnostics stay on the OS disk.
  Install-QemuGA.ps1: |-
    $ErrorActionPreference = 'Stop'
    $setupDir = 'C:\ProbeTest'
    New-Item -ItemType Directory -Path $setupDir -Force | Out-Null
    $msiPath = Join-Path $setupDir 'qemu-ga-x86_64.msi'
    $logPath = Join-Path $setupDir 'qemu-ga-install.log'

    Write-Output 'Downloading QEMU guest agent'
    Invoke-WebRequest -Uri 'https://salt-fileserver.servercontrol.com.au/files/virtio/qemu-ga-x86_64.msi' -OutFile $msiPath -UseBasicParsing -TimeoutSec 180
    $arguments = '/i "{0}" /qn /norestart /l*v "{1}"' -f $msiPath, $logPath
    $installer = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru
    if ($installer.ExitCode -notin @(0, 3010)) {
        throw "QEMU guest agent installation failed with exit code $($installer.ExitCode); see $logPath"
    }
    if ($installer.ExitCode -eq 3010) {
        Write-Warning 'QEMU guest agent installation requires a reboot after Windows setup completes'
    }

    $service = Get-CimInstance -ClassName Win32_Service -Filter "Name = 'QEMU-GA'"
    if ($null -eq $service) {
        throw 'The MSI did not register the QEMU-GA service'
    }
    $match = [regex]::Match($service.PathName, '^\s*(?:"(?<exe>[^"]+)"|(?<exe>\S+))')
    $exePath = $match.Groups['exe'].Value
    if (-not $match.Success -or -not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
        throw "Cannot locate the QEMU-GA executable from service path: $($service.PathName)"
    }

    $controller = Get-Service -Name 'QEMU-GA'
    if ($controller.Status -ne 'Stopped') {
        Stop-Service -Name 'QEMU-GA'
        $controller.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))
    }
    # -d is required for Windows service mode; COM2 carries the agent protocol.
    $binaryPath = '"{0}" -d --method isa-serial --path COM2' -f $exePath
    $change = Invoke-CimMethod -InputObject $service -MethodName Change -Arguments @{
        PathName = $binaryPath
        StartMode = 'Automatic'
    }
    if ($change.ReturnValue -ne 0) {
        throw "Configuring QEMU-GA failed with Win32_Service.Change code $($change.ReturnValue)"
    }
    $configured = Get-CimInstance -ClassName Win32_Service -Filter "Name = 'QEMU-GA'"
    if ($configured.PathName -ne $binaryPath -or $configured.StartMode -ne 'Auto') {
        throw 'QEMU-GA service configuration did not persist'
    }
    Start-Service -Name 'QEMU-GA'
    $controller.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
    Write-Output "QEMU-GA is running: $binaryPath"

  Install-Probe.ps1: |-
    $ErrorActionPreference = 'Stop'
    New-Item -ItemType Directory -Path 'C:\ProbeTest' -Force | Out-Null
    Copy-Item -LiteralPath (Join-Path $PSScriptRoot 'Read-Status.ps1') -Destination 'C:\ProbeTest\Read-Status.ps1' -Force

  # Included on the sysprep ISO and copied to the OS disk during specialize.
  Read-Status.ps1: |-
    param(
        [string]$Path = 'C:\ProbeTest\status.json',
        [switch]$UseStderr
    )

    $ErrorActionPreference = 'Stop'
    $exitCode = 30

    try {
        $text = [IO.File]::ReadAllText($Path)
        $status = $text | ConvertFrom-Json

        switch -CaseSensitive ($status.status) {
            'Pending'   { $exitCode = 10 }
            'Succeeded' { $exitCode = 0 }
            'Failed'    {
                if ([string]::IsNullOrWhiteSpace($status.errorCode)) {
                    throw 'Failure requires an error code'
                }
                $exitCode = 20
            }
            default { throw 'Invalid status' }
        }

        $result = $status |
            Select-Object status, errorCode, commandExitCode
    }
    catch [IO.FileNotFoundException] {
        $result = @{ status = 'Pending'; errorCode = 'FileMissing' }
        $exitCode = 10
    }
    catch {
        $result = @{
            status = 'ReportingError'
            errorCode = 'StatusReadOrParseFailed'
        }
    }

    $line = 'FLEET_PROBE_TEST ' + ($result | ConvertTo-Json -Compress)
    if ($UseStderr) {
        [Console]::Error.WriteLine($line)
    } else {
        [Console]::Out.WriteLine($line)
    }
    exit $exitCode

  # KubeVirt requires this exact lowercase filename on sysprep media. This
  # install-time answer file is intentionally empty for a generalized image.
  autounattend.xml: |-
    <?xml version="1.0" encoding="utf-8"?>
    <unattend xmlns="urn:schemas-microsoft-com:unattend" />

  # Windows uses unattend.xml while completing OOBE on a generalized image.
  # Keep both password values identical after replacing the example value.
  unattend.xml: |-
    <?xml version="1.0" encoding="utf-8"?>
    <unattend xmlns="urn:schemas-microsoft-com:unattend">
      <settings pass="specialize">
        <component name="Microsoft-Windows-Deployment"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35"
                   language="neutral"
                   versionScope="nonSxS"
                   xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <RunSynchronous>
            <RunSynchronousCommand wcm:action="add">
              <Order>1</Order>
              <Description>Enable EMS in BCD</Description>
              <Path>powershell.exe -ExecutionPolicy Bypass -NoProfile -Command "bcdedit /ems on"</Path>
            </RunSynchronousCommand>
            <RunSynchronousCommand wcm:action="add">
              <Order>2</Order>
              <Description>Set EMS Port to 1</Description>
              <Path>powershell.exe -ExecutionPolicy Bypass -NoProfile -Command "bcdedit /emssettings EMSPORT:1"</Path>
            </RunSynchronousCommand>
            <RunSynchronousCommand wcm:action="add">
              <Order>3</Order>
              <Description>Install Read-Status probe script</Description>
              <!-- Path is limited to 259 characters; keep copy logic on the media. -->
              <Path>powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $p=@(Get-PSDrive -PSProvider FileSystem|%{$_.Root+'Install-Probe.ps1'}|?{Test-Path $_}); if($p.Count -ne 1){throw 'Sysprep media'}; &amp; $p[0]"</Path>
            </RunSynchronousCommand>
            <RunSynchronousCommand wcm:action="add">
              <Order>4</Order>
              <Description>Install and configure QEMU guest agent on COM2</Description>
              <Path>powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $p=@(Get-PSDrive -PSProvider FileSystem|%{$_.Root+'Install-QemuGA.ps1'}|?{Test-Path $_}); if($p.Count -ne 1){throw 'Sysprep media'}; &amp; $p[0]"</Path>
            </RunSynchronousCommand>
          </RunSynchronous>
        </component>
      </settings>

      <settings pass="oobeSystem">
        <component name="Microsoft-Windows-International-Core"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35"
                   language="neutral"
                   versionScope="nonSxS"
                   xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <InputLocale>en-US</InputLocale>
          <SystemLocale>en-US</SystemLocale>
          <UILanguage>en-US</UILanguage>
          <UserLocale>en-US</UserLocale>
        </component>
        <component name="Microsoft-Windows-Shell-Setup"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35"
                   language="neutral"
                   versionScope="nonSxS"
                   xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <OOBE>
            <HideEULAPage>true</HideEULAPage>
            <HideLocalAccountScreen>true</HideLocalAccountScreen>
            <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
            <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
            <NetworkLocation>Work</NetworkLocation>
            <ProtectYourPC>3</ProtectYourPC>
          </OOBE>
          <UserAccounts>
            <AdministratorPassword>
              <Value>GPBurdell123</Value>
                <PlainText>true</PlainText>
            </AdministratorPassword>
          </UserAccounts>
        </component>
      </settings>
    </unattend>

---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cloudbuild00
spec:
  runStrategy: Always
  template:
    spec:
      readinessProbe:
        timeoutSeconds: 5
        exec:
          command:
          - powershell.exe
          - -NoProfile
          - -NonInteractive
          - -ExecutionPolicy
          - Bypass
          - -File
          - C:\ProbeTest\Read-Status.ps1
          - -UseStderr
      architecture: amd64
      domain:
        cpu:
          cores: 4
          model: host-model
        devices:
          disks:
          - name: sysprep
            cdrom:
              bus: vmbus
              readonly: true
          - disk:
              bus: vmbus
            name: rootdisk
          interfaces:
          - bridge: {}
            model: vmbus
            name: default
        features:
          acpi:
            enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: false
        memory:
          guest: 4Gi
      evictionStrategy: None
      networks:
      - name: default
        pod: {}
      volumes:
      - name: sysprep
        sysprep:
          secret:
            name: cloudbuild-unattend-datavolume-sysprep
      - name: rootdisk
        dataVolume:
          name: 1es-windows-vhd

  dataVolumeTemplates:
  - metadata:
      name: 1es-windows-vhd
    spec:
      pvc:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 180Gi
        storageClassName: local
      source:
        registry:
          url: docker://acrafoimages.azurecr.io/kubevirt-openvmm/windows-1es-image:vhd-11-18-2026
